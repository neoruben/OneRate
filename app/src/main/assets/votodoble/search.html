<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneRate</title>
<style>
  :root {
    /* Azul FilmAffinity de base + amarillo IMDb de acento */
    --bg: #0e1726; --card: #16233a; --line: #26395a; --text: #e9eef6; --dim: #95a6bf;
    --accent: #f5c518; --fa: #4a90e2; --lb: #00c030; --ok: #2fbf71; --err: #e5534b;
    --mix: linear-gradient(90deg, #4a90e2, #f5c518);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100dvh; margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  header { flex: none; z-index: 2; transition: padding-top .35s ease; padding-top: 10px; border-bottom: 2px solid transparent; border-image: var(--mix) 1; background: var(--bg); padding: 12px 12px 8px; }
  h1 { font-size: 17px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 24px; height: 24px; }
  form { display: flex; gap: 8px; }
  input[type=search] {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--card);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; outline: none;
  }
  input[type=search]:focus { border-color: var(--fa); }
  button { font: inherit; border: 0; border-radius: 10px; cursor: pointer; }
  .primary { background: var(--mix); color: #0e1726; font-weight: 700; padding: 10px 14px; }
  .ghost { background: transparent; color: var(--dim); padding: 6px 8px; }
  h1 { margin-left: -4px; }
  .b1 { color: var(--fa); } .b2 { color: var(--accent); }
  .burger { flex: none; background: transparent; color: var(--text); font-size: 24px; padding: 0 6px 0 2px; line-height: 1; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9; }
  .drawer { position: fixed; top: 0; bottom: 0; left: 0; width: 80%; max-width: 320px; z-index: 10; background: var(--card);
    transform: translateX(-105%); transition: transform .2s ease; padding: 16px 10px; overflow-y: auto; box-shadow: 4px 0 16px rgba(0,0,0,.4); }
  .drawer.open { transform: none; }
  .drawer { border-right: 2px solid transparent; border-image: linear-gradient(180deg, #4a90e2, #f5c518) 1; }
  .dh { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; padding: 4px 8px 14px; }
  .dh img { width: 28px; height: 28px; }
  .nv { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; color: var(--text); padding: 12px 8px; }
  .nv:active { background: var(--bg); }
  .nv span:last-child { display: flex; flex-direction: column; }
  .ic { width: 40px; height: 40px; flex: none; border-radius: 10px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: var(--bg); }
  .ic.svc { border-radius: 50%; color: #fff; font-size: 17px; }
  .ic.svc.fa { background: #2f6db5; }
  .ic.svc.imdb { background: #f5c518; color: #121212; }
  .ic.svc.lb { background: #00b02c; }
  .ic.svc.kofi { background: var(--mix); font-size: 19px; }
  .lg0 { font-size: 13px; color: var(--dim); }
  .sep { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; padding: 14px 8px 4px; border-top: 1px solid var(--line); margin-top: 6px; }
  .lg { font-size: 13px; color: var(--dim); }
  .lg::before { content: '●'; margin-right: 5px; }
  .lg.on { color: var(--ok); } .lg.off { color: var(--err); }
  .legal { color: var(--dim); opacity: .7; font-size: 11px; line-height: 1.35; padding: 16px 8px 0; margin: 0; }
  .hint { color: var(--dim); font-size: 12px; padding: 12px 8px 0; margin: 0; }
  body.home header { padding-top: 26dvh; border-image: none; border-bottom-color: transparent; }
  body.home .msg { padding-top: 14px; }
  /* Puntitos de "cargando" */
  .dots { display: inline-flex; gap: 4px; margin-left: 4px; vertical-align: middle; }
  .dots i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: vdblink 1.2s ease-in-out infinite; }
  .dots i:nth-child(2) { animation-delay: .2s; }
  .dots i:nth-child(3) { animation-delay: .4s; }
  @keyframes vdblink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
  main { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 12px 12px; }
  /* Ficha: todo cabe en pantalla, sin scroll; el botón de votar queda abajo */
  main.dv { display: flex; flex-direction: column; overflow: hidden; }
  main.dv > .ghost { align-self: flex-start; padding: 2px 4px; }
  main.dv .detail { margin: 2px 0 6px; gap: 12px; }
  main.dv .detail .poster { width: 60px; height: 90px; }
  main.dv .detail h2 { font-size: 16px; margin: 0 0 2px; }
  main.dv .site { padding: 8px 10px; margin: 4px 0; }
  main.dv .site.fa { position: relative; z-index: 4; }
  main.dv .thumb { width: 30px; height: 45px; }
  main.dv h3 { margin: 8px 0 6px; }
  main.dv .grid { gap: 6px; }
  main.dv .grid button { padding: 9px 0; font-size: 17px; }
  main.dv .vote { margin-top: auto; }
  #fa-list { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; padding: 6px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .msg { color: var(--dim); text-align: center; padding: 28px 8px; }
  .err { color: var(--err); }

  .item { display: flex; gap: 12px; align-items: center; padding: 8px; border-radius: 12px; cursor: pointer; }
  .item:active { background: var(--card); }
  .poster { width: 54px; height: 80px; flex: none; border-radius: 6px; background: var(--card) center/cover no-repeat; }
  .item .t { font-weight: 600; }
  .item .s { color: var(--dim); font-size: 13px; }

  .detail { display: flex; gap: 14px; margin: 6px 0 14px; }
  .detail .poster { width: 96px; height: 142px; }
  .detail h2 { font-size: 18px; margin: 2px 0 4px; }
  .site { background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 8px 0; }
  .site .lbl { font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .site .lbl { color: var(--dim); }
  .lbstars { color: var(--lb); letter-spacing: 1px; }
  .site .m { margin-top: 2px; }
  .dd { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px;
    text-align: left; background: var(--bg); color: var(--text); padding: 10px; border: 2px solid var(--fa); font-size: 14px; }
  .dd .row { margin: 0; }
  .dd .arrow { color: var(--fa); font-size: 18px; transition: transform .15s; }
  .dd.open .arrow { transform: rotate(180deg); }
  #fa-list { max-height: 45dvh; overflow-y: auto; }
  .choices { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 4px; }
  .thumb { width: 40px; height: 60px; flex: none; border-radius: 4px; background: var(--bg) center/cover no-repeat; }
  .choice { display: flex; gap: 10px; align-items: center;
    text-align: left; background: var(--bg); color: var(--text); padding: 10px; border: 2px solid var(--line); font-size: 14px; }
  .choice.sel { border-color: var(--fa); background: #1b3152; }
  .site select { width: 100%; margin-top: 6px; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .site .st { margin-top: 6px; font-size: 14px; }
  .site .avg { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--accent); }
  .site .avg.none { color: var(--dim); font-weight: 400; font-size: 13px; }
  .site .avg:empty { display: none; }
  .st.ok { color: var(--ok); } .st.bad { color: var(--err); }

  h3 { font-size: 14px; color: var(--dim); font-weight: 600; margin: 18px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .grid button { background: var(--card); color: var(--text); font-size: 18px; font-weight: 700; padding: 14px 0; border: 2px solid transparent; }
  .grid button.sel { border: 2px solid transparent; background: linear-gradient(var(--card), var(--card)) padding-box, var(--mix) border-box; color: var(--accent); }
  .vote { width: 100%; margin-top: 12px; padding: 14px; font-size: 16px; }
  .vote:disabled { opacity: .45; }
</style>
</head>
<body class="home">
  <header>
    <form id="f">
      <button class="burger" id="burger" type="button" aria-label="Menu" data-i18n-aria="menu">☰</button>
      <input id="q" type="search" placeholder="Search for a movie or series" data-i18n-ph="searchPh" autocomplete="off" enterkeyhint="search">
      <button class="primary" type="submit" data-i18n="search">Search</button>
    </form>
  </header>
  <div class="scrim" id="scrim" hidden></div>
  <nav class="drawer" id="drawer" aria-hidden="true">
    <div class="dh"><img src="icon-48.png" alt=""><span class="b1">One</span><span class="b2">Rate</span></div>
    <button class="nv" id="nv-search"><span class="ic">🔍</span><span data-i18n="navSearch">Search movie</span></button>
    <div class="sep" data-i18n="accounts">Your accounts</div>
    <button class="nv" id="nv-fa"><span class="ic svc fa">F</span><span><b>FilmAffinity</b><small id="lg-fa" class="lg" data-i18n="checking">Checking…</small></span></button>
    <button class="nv" id="nv-imdb"><span class="ic svc imdb">I</span><span><b>IMDb</b><small id="lg-imdb" class="lg" data-i18n="checking">Checking…</small></span></button>
    <button class="nv" id="nv-lb"><span class="ic svc lb">L</span><span><b>Letterboxd</b><small id="lg-lb" class="lg" data-i18n="checking">Checking…</small></span></button>
    <div class="sep" data-i18n="support">Support the project</div>
    <button class="nv" id="nv-kofi"><span class="ic svc kofi">☕</span><span><b data-i18n="coffee">Buy me a coffee</b><small class="lg0" data-i18n="opensBrowser">Opens in your browser</small></span></button>
    <p class="hint" data-i18n="hint">Tap an account to open the site and sign in or out. Come back here with the back gesture.</p>
    <p class="legal" data-i18n="legal"></p>
  </nav>
  <main id="main"></main>
  <script src="search.js"></script>
</body>
</html>
